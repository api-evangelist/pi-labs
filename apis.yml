name: Pi Labs
description: >-
  Pi Labs (withpi.ai) is an applied-AI company, backed by Accel and later acquired
  by Microsoft, that builds tooling to evaluate and enhance AI applications. Its core
  product, Pi Scorer, is a deterministic, roughly 200ms foundation model that scores
  any text against a rubric of natural-language questions — reported to be about 500x
  more efficient than using an LLM as a judge. Teams use it to calibrate rubrics, gate
  and rank LLM outputs, and close the loop across training, inference, and feedback.
  The scoring engine is exposed as an OpenAPI-compatible REST API at api.withpi.ai with
  official Python and TypeScript SDKs (both published as "withpi"), a copilot for
  building scoring specs, and a Promptfoo integration (Pi Scorer).
